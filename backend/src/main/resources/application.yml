spring:
  application:
    name: investin-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/investin}
    username: ${DATABASE_USER:investin}
    password: ${DATABASE_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
  jackson:
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

app:
  # Image storage: "local" (disk, STORAGE_DIR) or "s3" (any S3-compatible service: AWS S3, Cloudflare R2, MinIO, ...)
  storage-type: ${STORAGE_TYPE:local}
  s3:
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:auto}
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style: ${S3_PATH_STYLE:true}
  storage-dir: ${STORAGE_DIR:./data/uploads}
  # Admin bootstrap: only used when no admin exists. Both must be set; there is no default password.
  admin-bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  admin-bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  # Inquiry e-mail notifications: enabled only when MAIL_HOST and INQUIRY_NOTIFY_TO are both set.
  inquiry-notify-to: ${INQUIRY_NOTIFY_TO:}
  mail-from: ${MAIL_FROM:no-reply@investin.az}
  stale-after-days: ${STALE_AFTER_DAYS:60}
  rate-limit-enabled: ${RATE_LIMIT_ENABLED:true}
  api-requests-per-minute: ${API_REQUESTS_PER_MINUTE:240}
  inquiries-per-hour: ${INQUIRIES_PER_HOUR:5}
  login-attempts-per-15-min: ${LOGIN_ATTEMPTS_PER_15_MIN:10}
